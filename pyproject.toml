[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "unoesc-tools"
version = "0.2.0"
description = "Ferramentas para automação do Portal de Ensino UNOESC e Moodle ON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Roberson" }]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/robersonjfa/unoesc-tools"

[tool.setuptools.packages.find]
include = ["unoesc*"]
